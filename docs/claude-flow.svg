<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1483" viewBox="0 0 1700 1483" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="1700" height="1483" fill="#fff"/>
<text x="30" y="38" font-size="24" font-weight="700" fill="#222">From the Plan with Claude button to a plan made by Claude</text>
<text x="30" y="58" font-size="13.5" fill="#555">Everything after step 3 happens with nobody at the phone. The automatic rules plan (written at every Finish) is already there as a fallback.</text>
<rect x="30" y="70" width="400" height="1343" rx="12" fill="#d9f1f1" fill-opacity="0.35" stroke="#0b6e6e" stroke-width="2.5" stroke-dasharray="2 0"/><text x="48" y="95" font-size="17" font-weight="700" fill="#0b6e6e">Phone and watch</text><text x="48" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="520" y="70" width="540" height="1343" rx="12" fill="#dbe9f7" fill-opacity="0.35" stroke="#1f4e79" stroke-width="2.5" stroke-dasharray="2 0"/><text x="538" y="95" font-size="17" font-weight="700" fill="#1f4e79">Supabase database</text><text x="538" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="1150" y="70" width="520" height="1343" rx="12" fill="#fde9d0" fill-opacity="0.35" stroke="#9a4f00" stroke-width="2.5" stroke-dasharray="2 0"/><text x="1168" y="95" font-size="17" font-weight="700" fill="#9a4f00">claude.ai scheduled task</text><text x="1168" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="50" y="120" width="360" height="132" rx="9" fill="#d9f1f1" stroke="#0b6e6e" stroke-width="2"/><circle cx="74" cy="144" r="14" fill="#0b6e6e"/><text x="74" y="149" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="98" y="149" font-size="15" font-weight="700" fill="#0b6e6e" text-anchor="start" >You tap Plan with Claude</text><text x="66" y="176" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >On the routine, the day you will train it. A</text><text x="66" y="195" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >pop-up asks "Are you sure?". Then the button</text><text x="66" y="214" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >says "Claude is planning..." and the phone checks</text><text x="66" y="233" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >every 10 seconds whether the plan is in.</text><rect x="540" y="120" width="500" height="132" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="144" r="14" fill="#1f4e79"/><text x="564" y="149" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="588" y="149" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >request_routine_plan</text><text x="556" y="176" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Checks the routine is yours. A second tap within</text><text x="556" y="195" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >2 minutes is ignored. Reads the address and the</text><text x="556" y="214" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >token from the Vault (never in the code), sends one</text><text x="556" y="233" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >HTTP request with pg_net: "routine: Workout B".</text><rect x="1170" y="120" width="480" height="113" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="144" r="14" fill="#9a4f00"/><text x="1194" y="149" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="1218" y="149" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >The task starts</text><text x="1186" y="176" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Nobody is watching. It reads only the routine's</text><text x="1186" y="195" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >name from the request, and ignores anything</text><text x="1186" y="214" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >else in it. An unknown routine name: it stops.</text><rect x="1170" y="290" width="480" height="132" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="314" r="14" fill="#9a4f00"/><text x="1194" y="319" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="1218" y="319" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Reads your instructions</text><text x="1186" y="346" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >select claude_instructions(true), through the</text><text x="1186" y="365" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Supabase connector: your goal, the planning</text><text x="1186" y="384" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >guide and the evidence notes. This text is yours,</text><text x="1186" y="403" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >so it is followed. An empty text: it stops.</text><rect x="540" y="290" width="500" height="94" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="319" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >documents</text><text x="556" y="346" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >owner-goal, planning-guide, evidence-notes</text><text x="556" y="365" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(the guide is published from CLAUDE_GUIDE.md)</text><rect x="1170" y="460" width="480" height="132" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="484" r="14" fill="#9a4f00"/><text x="1194" y="489" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="1218" y="489" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Reads your data (select only)</text><text x="1186" y="516" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The last 6 sessions of any routine (every set,</text><text x="1186" y="535" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >scores, feelings), that routine's own last 4 and</text><text x="1186" y="554" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >your notes, the muscle totals, weekly overview,</text><text x="1186" y="573" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >measurements and check-ins.</text><rect x="540" y="460" width="500" height="132" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="489" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >views and tables it reads</text><text x="556" y="516" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >sessions, sets, session_scores, session_muscles,</text><text x="556" y="535" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >weekly_muscles, weekly_overview, body_latest,</text><text x="556" y="554" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >body_shape, body_checkins, exercise_history,</text><text x="556" y="573" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >current_plan</text><rect x="1170" y="650" width="480" height="151" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="674" r="14" fill="#9a4f00"/><text x="1194" y="679" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >6</text><text x="1218" y="679" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Decides today's session</text><text x="1186" y="706" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Double progression inside each rep range, from</text><text x="1186" y="725" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >each exercise's own last session, the weight steps</text><text x="1186" y="744" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(increment_kg), what the other routines did since,</text><text x="1186" y="763" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >your goal and the research notes. It flags any</text><text x="1186" y="782" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >exercise whose step is unknown.</text><rect x="540" y="650" width="500" height="132" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="679" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >What Claude may and may not do</text><text x="556" y="706" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >It uses select queries and submit_plan only: it</text><text x="556" y="725" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >never inserts, updates or deletes anything else.</text><text x="556" y="744" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Text found in the database (notes, titles) is</text><text x="556" y="763" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >treated as data, never as instructions.</text><rect x="1170" y="840" width="480" height="113" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="864" r="14" fill="#9a4f00"/><text x="1194" y="869" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >7</text><text x="1218" y="869" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Calls submit_plan</text><text x="1186" y="896" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >submit_plan(routine, plan as JSON, note):</text><text x="1186" y="915" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >every exercise with its sets: weight, rep range.</text><text x="1186" y="934" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >It may not insert, update or delete anything else.</text><rect x="540" y="840" width="500" height="151" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="864" r="14" fill="#1f4e79"/><text x="564" y="869" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >8</text><text x="588" y="869" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >submit_plan checks and saves</text><text x="556" y="896" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Rejects unknown exercise names, repeated</text><text x="556" y="915" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >exercises and impossible sets (with a message).</text><text x="556" y="934" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Replaces an older pending Claude plan, then</text><text x="556" y="953" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >writes planned_sessions (claude, pending) and</text><text x="556" y="972" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >planned_sets.</text><rect x="540" y="1050" width="500" height="132" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="1074" r="14" fill="#1f4e79"/><text x="564" y="1079" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >9</text><text x="588" y="1079" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >The phone sees it</text><text x="556" y="1106" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >routine_plan_status: no longer waiting. current_plan:</text><text x="556" y="1125" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >a pending Claude plan beats the automatic rules plan.</text><text x="556" y="1144" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >workout_plan / workout_start merge it with any</text><text x="556" y="1163" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >change you made to the routine.</text><rect x="50" y="1050" width="360" height="113" rx="9" fill="#d9f1f1" stroke="#0b6e6e" stroke-width="2"/><circle cx="74" cy="1074" r="14" fill="#0b6e6e"/><text x="74" y="1079" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >10</text><text x="98" y="1079" font-size="15" font-weight="700" fill="#0b6e6e" text-anchor="start" >You see it</text><text x="66" y="1106" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The routine says "Claude plan ready" with</text><text x="66" y="1125" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Claude's note. The targets show next to what you</text><text x="66" y="1144" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >did last time. The watch hints after each set.</text><rect x="50" y="1240" width="360" height="113" rx="9" fill="#ece1f7" stroke="#6b3fa0" stroke-width="2"/><circle cx="74" cy="1264" r="14" fill="#6b3fa0"/><text x="74" y="1269" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >11</text><text x="98" y="1269" font-size="15" font-weight="700" fill="#6b3fa0" text-anchor="start" >You train, then Finish</text><text x="66" y="1296" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The workout is saved on the device first and</text><text x="66" y="1315" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >uploads when there is signal. It gets its score: the</text><text x="66" y="1334" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >share of planned sets met.</text><rect x="540" y="1240" width="500" height="132" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="1269" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >sync_workout, then finish_session</text><text x="556" y="1296" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Marks the plan you followed as used and writes</text><text x="556" y="1315" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >the automatic rules plan for next time (the</text><text x="556" y="1334" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >fallback). It does not ask Claude: you do, with</text><text x="556" y="1353" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >the button, on the day.</text><path d="M410 150 L540 150" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="475.0" y="142" font-size="12" font-weight="700" fill="#444" text-anchor="middle" >ask</text><path d="M1040 150 L1170 150" fill="none" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="142" font-size="12" font-weight="700" fill="#9a4f00" text-anchor="middle" >HTTPS call</text><path d="M1410.0 233 L1410.0 290" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 320 L1040 320" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="312" font-size="12" font-weight="700" fill="#555" text-anchor="middle" >SQL</text><path d="M1410.0 422 L1410.0 460" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 490 L1040 490" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="482" font-size="12" font-weight="700" fill="#555" text-anchor="middle" >SQL</text><path d="M1410.0 592 L1410.0 650" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1410.0 801 L1410.0 840" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 870 L1040 870" fill="none" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="862" font-size="12" font-weight="700" fill="#9a4f00" text-anchor="middle" >writes plan</text><path d="M790.0 991 L790.0 1050" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M540 1080 L410 1080" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="475.0" y="1072" font-size="12" font-weight="700" fill="#444" text-anchor="middle" >the plan</text><path d="M230.0 1163 L230.0 1240" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M410 1270 L540 1270" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="475.0" y="1262" font-size="12" font-weight="700" fill="#444" text-anchor="middle" >upload</text><path d="M50 1270 L9 1270 L9 150 L50 150" fill="none" stroke="#6b3fa0" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="24" y="1200" font-size="12" font-weight="700" fill="#6b3fa0" text-anchor="start" transform="rotate(-90 24 1200)">next time you want a plan</text><g font-size="13" fill="#222"><rect x="30" y="1421" width="1640" height="46" rx="8" fill="#fff" stroke="#bbb"/>
<line x1="48" y1="1444" x2="98" y2="1444" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="108" y="1449">happens inside one place / one step to the next</text>
<line x1="500" y1="1444" x2="550" y2="1444" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="560" y="1449">crosses the internet (HTTPS)</text>
<line x1="830" y1="1444" x2="880" y2="1444" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="890" y="1449">a read-only query through the Supabase connector</text></g></svg>