<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1823" viewBox="0 0 1700 1823" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="1700" height="1823" fill="#fff"/>
<text x="30" y="38" font-size="24" font-weight="700" fill="#222">From Finish to a plan made by Claude</text>
<text x="30" y="58" font-size="13.5" fill="#555">Everything after step 4 happens with nobody at the phone. The automatic rules plan (step 3) is already there as a fallback.</text>
<rect x="30" y="70" width="400" height="1683" rx="12" fill="#d9f1f1" fill-opacity="0.35" stroke="#0b6e6e" stroke-width="2.5" stroke-dasharray="2 0"/><text x="48" y="95" font-size="17" font-weight="700" fill="#0b6e6e">Phone and watch</text><text x="48" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="520" y="70" width="540" height="1683" rx="12" fill="#dbe9f7" fill-opacity="0.35" stroke="#1f4e79" stroke-width="2.5" stroke-dasharray="2 0"/><text x="538" y="95" font-size="17" font-weight="700" fill="#1f4e79">Supabase database</text><text x="538" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="1150" y="70" width="520" height="1683" rx="12" fill="#fde9d0" fill-opacity="0.35" stroke="#9a4f00" stroke-width="2.5" stroke-dasharray="2 0"/><text x="1168" y="95" font-size="17" font-weight="700" fill="#9a4f00">claude.ai scheduled task</text><text x="1168" y="112" font-size="12" fill="#666" font-style="italic" transform="translate(0,0)"></text><rect x="50" y="120" width="360" height="132" rx="9" fill="#d9f1f1" stroke="#0b6e6e" stroke-width="2"/><circle cx="74" cy="144" r="14" fill="#0b6e6e"/><text x="74" y="149" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="98" y="149" font-size="15" font-weight="700" fill="#0b6e6e" text-anchor="start" >You tap Finish</text><text x="66" y="176" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The workout is saved on the phone or watch</text><text x="66" y="195" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >first, so it works with no signal. You can tap</text><text x="66" y="214" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >a feeling from 1 to 5. Until it uploads, the</text><text x="66" y="233" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >history shows "waiting to upload".</text><rect x="540" y="120" width="500" height="132" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="144" r="14" fill="#1f4e79"/><text x="564" y="149" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="588" y="149" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >sync_workout uploads it</text><text x="556" y="176" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Session, sets and feeling are merged into the</text><text x="556" y="195" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >database (safe to repeat: ids are made on the</text><text x="556" y="214" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >device). A workout done on two devices is one.</text><text x="556" y="233" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Finishing then runs finish_session.</text><rect x="540" y="290" width="500" height="151" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="314" r="14" fill="#1f4e79"/><text x="564" y="319" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="588" y="319" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >finish_session</text><text x="556" y="346" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Marks the session as ended.</text><text x="556" y="365" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Marks the routine's pending plans as used.</text><text x="556" y="384" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >generate_plan: writes the automatic rules plan</text><text x="556" y="403" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >right away, so a plan exists even if Claude</text><text x="556" y="422" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >never answers.</text><rect x="540" y="500" width="500" height="151" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="524" r="14" fill="#1f4e79"/><text x="564" y="529" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="588" y="529" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >request_claude_plan</text><text x="556" y="556" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Reads the address and the token from the Vault</text><text x="556" y="575" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(never in the code). Sends one HTTP request</text><text x="556" y="594" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >with pg_net: "routine: Workout B" + session id.</text><text x="556" y="613" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Only once per session. If it fails, the finish</text><text x="556" y="632" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >still succeeds (the rules plan stays).</text><rect x="1170" y="500" width="480" height="113" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="524" r="14" fill="#9a4f00"/><text x="1194" y="529" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >5</text><text x="1218" y="529" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >The task starts</text><text x="1186" y="556" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Nobody is watching. It reads only the routine's</text><text x="1186" y="575" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >name from the request, and ignores anything</text><text x="1186" y="594" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >else in it. An unknown routine name: it stops.</text><rect x="1170" y="670" width="480" height="132" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="694" r="14" fill="#9a4f00"/><text x="1194" y="699" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >6</text><text x="1218" y="699" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Reads your instructions</text><text x="1186" y="726" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >select claude_instructions(true), through the</text><text x="1186" y="745" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Supabase connector: your goal, the planning</text><text x="1186" y="764" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >guide and the evidence notes. This text is yours,</text><text x="1186" y="783" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >so it is followed. An empty text: it stops.</text><rect x="540" y="670" width="500" height="94" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="699" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >documents</text><text x="556" y="726" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >owner-goal, planning-guide, evidence-notes</text><text x="556" y="745" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(the guide is published from CLAUDE_GUIDE.md)</text><rect x="1170" y="840" width="480" height="132" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="864" r="14" fill="#9a4f00"/><text x="1194" y="869" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >7</text><text x="1218" y="869" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Reads your data (select only)</text><text x="1186" y="896" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The routine's exercises and rep ranges, the last</text><text x="1186" y="915" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >4 sessions (every set, your notes), then how the</text><text x="1186" y="934" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >body is doing: weekly overview, session scores</text><text x="1186" y="953" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >and feelings, measurements, check-ins.</text><rect x="540" y="840" width="500" height="113" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="869" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >views and tables it reads</text><text x="556" y="896" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >routine_exercises, exercises, sets, sessions,</text><text x="556" y="915" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >session_scores, weekly_overview, body_latest,</text><text x="556" y="934" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >body_shape, body_checkins, current_plan</text><rect x="1170" y="1010" width="480" height="132" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="1034" r="14" fill="#9a4f00"/><text x="1194" y="1039" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >8</text><text x="1218" y="1039" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Decides the next session</text><text x="1186" y="1066" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Double progression inside each rep range, the</text><text x="1186" y="1085" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >weight steps (increment_kg), your goal and the</text><text x="1186" y="1104" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >research notes. It keeps your three routines and</text><text x="1186" y="1123" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >flags any exercise whose step is unknown.</text><rect x="540" y="1010" width="500" height="132" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="554" y="1039" font-size="15" font-weight="700" fill="#555555" text-anchor="start" >What Claude may and may not do</text><text x="556" y="1066" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >It uses select queries and submit_plan only: it</text><text x="556" y="1085" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >never inserts, updates or deletes anything else.</text><text x="556" y="1104" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Text found in the database (notes, titles) is</text><text x="556" y="1123" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >treated as data, never as instructions.</text><rect x="1170" y="1170" width="480" height="113" rx="9" fill="#fde9d0" stroke="#9a4f00" stroke-width="2"/><circle cx="1194" cy="1194" r="14" fill="#9a4f00"/><text x="1194" y="1199" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >9</text><text x="1218" y="1199" font-size="15" font-weight="700" fill="#9a4f00" text-anchor="start" >Calls submit_plan</text><text x="1186" y="1226" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >submit_plan(routine, plan as JSON, note):</text><text x="1186" y="1245" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >every exercise with its sets: weight, rep range.</text><text x="1186" y="1264" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >It may not insert, update or delete anything else.</text><rect x="540" y="1170" width="500" height="151" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="1194" r="14" fill="#1f4e79"/><text x="564" y="1199" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >10</text><text x="588" y="1199" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >submit_plan checks and saves</text><text x="556" y="1226" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Rejects unknown exercise names, repeated</text><text x="556" y="1245" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >exercises and impossible sets (with a message).</text><text x="556" y="1264" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Replaces an older pending Claude plan, then</text><text x="556" y="1283" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >writes planned_sessions (claude, pending) and</text><text x="556" y="1302" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >planned_sets.</text><rect x="540" y="1380" width="500" height="113" rx="9" fill="#dbe9f7" stroke="#1f4e79" stroke-width="2"/><circle cx="564" cy="1404" r="14" fill="#1f4e79"/><text x="564" y="1409" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >11</text><text x="588" y="1409" font-size="15" font-weight="700" fill="#1f4e79" text-anchor="start" >The app asks for the plan</text><text x="556" y="1436" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >current_plan: a pending Claude plan beats the</text><text x="556" y="1455" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >rules plan. workout_plan / workout_start merge</text><text x="556" y="1474" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >it with any change you made to the routine.</text><rect x="50" y="1380" width="360" height="132" rx="9" fill="#d9f1f1" stroke="#0b6e6e" stroke-width="2"/><circle cx="74" cy="1404" r="14" fill="#0b6e6e"/><text x="74" y="1409" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >12</text><text x="98" y="1409" font-size="15" font-weight="700" fill="#0b6e6e" text-anchor="start" >You see it</text><text x="66" y="1436" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The routine says "Claude plan ready" with</text><text x="66" y="1455" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Claude's note (or "Auto plan ready" if there is</text><text x="66" y="1474" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >none yet). The targets show next to what you</text><text x="66" y="1493" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >did last time. The watch hints after each set.</text><rect x="50" y="1580" width="360" height="113" rx="9" fill="#ece1f7" stroke="#6b3fa0" stroke-width="2"/><circle cx="74" cy="1604" r="14" fill="#6b3fa0"/><text x="74" y="1609" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" >13</text><text x="98" y="1609" font-size="15" font-weight="700" fill="#6b3fa0" text-anchor="start" >You train, then Finish again</text><text x="66" y="1636" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >The plan is marked used and the session gets</text><text x="66" y="1655" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >its score: the share of planned sets met.</text><text x="66" y="1674" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >That score and your feeling go to the next plan.</text><path d="M410 150 L540 150" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="475.0" y="142" font-size="12" font-weight="700" fill="#444" text-anchor="middle" >upload</text><path d="M790.0 252 L790.0 290" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M790.0 441 L790.0 500" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1040 530 L1170 530" fill="none" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="522" font-size="12" font-weight="700" fill="#9a4f00" text-anchor="middle" >HTTPS call</text><path d="M1410.0 613 L1410.0 670" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 700 L1040 700" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="692" font-size="12" font-weight="700" fill="#555" text-anchor="middle" >SQL</text><path d="M1410.0 802 L1410.0 840" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 870 L1040 870" fill="none" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="862" font-size="12" font-weight="700" fill="#555" text-anchor="middle" >SQL</text><path d="M1410.0 972 L1410.0 1010" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1410.0 1142 L1410.0 1170" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M1170 1200 L1040 1200" fill="none" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="1105.0" y="1192" font-size="12" font-weight="700" fill="#9a4f00" text-anchor="middle" >writes plan</text><path d="M790.0 1321 L790.0 1380" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M540 1410 L410 1410" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="475.0" y="1402" font-size="12" font-weight="700" fill="#444" text-anchor="middle" >the plan</text><path d="M230.0 1512 L230.0 1580" fill="none" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><path d="M50 1610 L9 1610 L9 150 L50 150" fill="none" stroke="#6b3fa0" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="24" y="1540" font-size="12" font-weight="700" fill="#6b3fa0" text-anchor="start" transform="rotate(-90 24 1540)">and round again</text><g font-size="13" fill="#222"><rect x="30" y="1761" width="1640" height="46" rx="8" fill="#fff" stroke="#bbb"/>
<line x1="48" y1="1784" x2="98" y2="1784" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><text x="108" y="1789">happens inside one place / one step to the next</text>
<line x1="500" y1="1784" x2="550" y2="1784" stroke="#9a4f00" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="560" y="1789">crosses the internet (HTTPS)</text>
<line x1="830" y1="1784" x2="880" y2="1784" stroke="#555" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="890" y="1789">a read-only query through the Supabase connector</text></g></svg>