<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="930" viewBox="0 0 1560 930" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1560" height="930" fill="#fff"/>
<text x="30" y="38" font-size="24" font-weight="700" fill="#222" text-anchor="start" >GymLogger: how the CI/CD would work</text><text x="30" y="62" font-size="13.5" font-weight="400" fill="#555" text-anchor="start" >CI = automatic checks on every push. CD = putting the result live. Green is automatic, orange needs your click, purple stays on your PC.</text><rect x="30" y="270" width="270" height="120" rx="9" fill="#ececec" stroke="#555555" stroke-width="2"/><text x="44" y="294" font-size="14.5" font-weight="700" fill="#555555" text-anchor="start" >You push to GitHub</text><text x="44" y="316" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >git push origin main</text><text x="44" y="335" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(this is the only thing you do</text><text x="44" y="354" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >for the automatic parts)</text><rect x="330" y="90" width="420" height="640" rx="12" fill="#e6eef8" stroke="#1f4e79" stroke-width="2.5"/><text x="348" y="121" font-size="17" font-weight="700" fill="#1f4e79" text-anchor="start" >CI: checks on every push</text><text x="348" y="142" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">automatic, needs no secrets</text><rect x="350" y="170" width="380" height="92" rx="9" fill="#e6eef8" stroke="#1f4e79" stroke-width="2"/><text x="364" y="194" font-size="14.5" font-weight="700" fill="#1f4e79" text-anchor="start" >1  Database tests</text><text x="364" y="216" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >240 checks, run on a</text><text x="364" y="235" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >temporary test database</text><rect x="350" y="275" width="380" height="92" rx="9" fill="#e6eef8" stroke="#1f4e79" stroke-width="2"/><text x="364" y="299" font-size="14.5" font-weight="700" fill="#1f4e79" text-anchor="start" >2  Phone app</text><text x="364" y="321" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >type-check, lint and build</text><rect x="350" y="380" width="380" height="92" rx="9" fill="#e6eef8" stroke="#1f4e79" stroke-width="2"/><text x="364" y="404" font-size="14.5" font-weight="700" fill="#1f4e79" text-anchor="start" >3  Importer tests</text><text x="364" y="426" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >the Hevy importer (Python)</text><rect x="350" y="485" width="380" height="92" rx="9" fill="#e6eef8" stroke="#1f4e79" stroke-width="2"/><text x="364" y="509" font-size="14.5" font-weight="700" fill="#1f4e79" text-anchor="start" >4  Watch app compiles</text><text x="364" y="531" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >build only: nothing is installed</text><rect x="350" y="610" width="180" height="100" rx="9" fill="#e4f4ea" stroke="#1e6b3a" stroke-width="2"/><text x="364" y="634" font-size="14.5" font-weight="700" fill="#1e6b3a" text-anchor="start" >All green</text><text x="364" y="656" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >the site job</text><text x="364" y="675" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >starts</text><rect x="550" y="610" width="180" height="100" rx="9" fill="#fbe4e4" stroke="#a32020" stroke-width="2"/><text x="564" y="634" font-size="14.5" font-weight="700" fill="#a32020" text-anchor="start" >Any red</text><text x="564" y="656" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >stop: nothing</text><text x="564" y="675" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >is deployed</text><line x1="300" y1="330" x2="330" y2="330" stroke="#444" stroke-width="2.2" marker-end="url(#arr)"/><line x1="750" y1="215" x2="830" y2="215" stroke="#1e6b3a" stroke-width="2.2" marker-end="url(#arr)"/><text x="790" y="205" font-size="12" font-weight="700" fill="#1e6b3a" text-anchor="middle" >green</text><rect x="830" y="90" width="700" height="270" rx="12" fill="#e4f4ea" stroke="#1e6b3a" stroke-width="2.5"/><text x="848" y="121" font-size="17" font-weight="700" fill="#1e6b3a" text-anchor="start" >Site: deploys itself when CI is green</text><text x="848" y="142" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">uses the Cloudflare and Supabase secrets</text><rect x="850" y="170" width="260" height="90" rx="9" fill="#e4f4ea" stroke="#1e6b3a" stroke-width="2"/><text x="864" y="194" font-size="14.5" font-weight="700" fill="#1e6b3a" text-anchor="start" >Is production's database</text><text x="864" y="216" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >up to date?</text><text x="864" y="235" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(any migration not applied yet?)</text><line x1="1110" y1="215" x2="1160" y2="215" stroke="#1e6b3a" stroke-width="2.2" marker-end="url(#arr)"/><text x="1135" y="205" font-size="12" font-weight="700" fill="#1e6b3a" text-anchor="middle" >yes</text><rect x="1160" y="170" width="350" height="90" rx="9" fill="#e4f4ea" stroke="#1e6b3a" stroke-width="2"/><text x="1174" y="194" font-size="14.5" font-weight="700" fill="#1e6b3a" text-anchor="start" >Build the phone app</text><text x="1174" y="216" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >and deploy it to Cloudflare</text><line x1="1335" y1="260" x2="1335" y2="292" stroke="#1e6b3a" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1160" y="292" width="350" height="50" rx="25" fill="#1e6b3a"/><text x="1335" y="322" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle" >Site is live: the phone updates itself</text><line x1="980" y1="260" x2="980" y2="292" stroke="#a32020" stroke-width="2.2" marker-end="url(#arr)"/><rect x="850" y="292" width="260" height="52" rx="9" fill="#fbe4e4" stroke="#a32020" stroke-width="2"/><text x="864" y="316" font-size="13" font-weight="700" fill="#a32020" text-anchor="start" >no: stop with a message</text><text x="864" y="338" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >"run the database button first"</text><rect x="830" y="390" width="700" height="270" rx="12" fill="#fdeedb" stroke="#9a4f00" stroke-width="2.5"/><text x="848" y="421" font-size="17" font-weight="700" fill="#9a4f00" text-anchor="start" >Database: only when you click</text><text x="848" y="442" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">GitHub, Actions, "Deploy database", Run workflow</text><rect x="850" y="470" width="210" height="118" rx="9" fill="#fdeedb" stroke="#9a4f00" stroke-width="2"/><text x="864" y="494" font-size="14.5" font-weight="700" fill="#9a4f00" text-anchor="start" >1  First run</text><text x="864" y="516" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >"apply" box NOT ticked</text><text x="864" y="535" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >dry run: shows the list</text><text x="864" y="554" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >changes nothing</text><line x1="1060" y1="529" x2="1090" y2="529" stroke="#9a4f00" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1090" y="470" width="210" height="118" rx="9" fill="#fdeedb" stroke="#9a4f00" stroke-width="2"/><text x="1104" y="494" font-size="14.5" font-weight="700" fill="#9a4f00" text-anchor="start" >2  Second run</text><text x="1104" y="516" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >"apply" box ticked</text><text x="1104" y="535" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >applies the migrations</text><text x="1104" y="554" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >to your real database</text><line x1="1300" y1="529" x2="1330" y2="529" stroke="#9a4f00" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1330" y="470" width="180" height="118" rx="9" fill="#fdeedb" stroke="#9a4f00" stroke-width="2"/><text x="1344" y="494" font-size="14.5" font-weight="700" fill="#9a4f00" text-anchor="start" >3  Same run</text><text x="1344" y="516" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >then deploys the</text><text x="1344" y="535" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >watch-pair function</text><text x="1344" y="554" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >(in this order)</text><text x="850" y="625" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">You read the list in run 1, then click again with the box ticked. Afterwards the site check above passes.</text><text x="850" y="646" font-size="12.5" font-weight="700" fill="#9a4f00" text-anchor="start" >Why by hand: a migration cannot be undone, and the tests never see your real data.</text><rect x="830" y="690" width="700" height="160" rx="12" fill="#efe6f8" stroke="#6b3fa0" stroke-width="2.5"/><text x="848" y="721" font-size="17" font-weight="700" fill="#6b3fa0" text-anchor="start" >Watch app: stays on your PC</text><text x="848" y="742" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-style="italic">GitHub cannot reach your watch, so this part is never automatic</text><rect x="850" y="760" width="200" height="78" rx="9" fill="#efe6f8" stroke="#6b3fa0" stroke-width="2"/><text x="864" y="784" font-size="14" font-weight="700" fill="#6b3fa0" text-anchor="start" >Build the release</text><text x="864" y="806" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >build.ps1 assembleRelease</text><line x1="1050" y1="799" x2="1080" y2="799" stroke="#6b3fa0" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1080" y="760" width="210" height="78" rx="9" fill="#efe6f8" stroke="#6b3fa0" stroke-width="2"/><text x="1094" y="784" font-size="14" font-weight="700" fill="#6b3fa0" text-anchor="start" >Connect over Wi-Fi</text><text x="1094" y="806" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >adb pair, adb connect</text><line x1="1290" y1="799" x2="1320" y2="799" stroke="#6b3fa0" stroke-width="2.2" marker-end="url(#arr)"/><rect x="1320" y="760" width="190" height="78" rx="9" fill="#efe6f8" stroke="#6b3fa0" stroke-width="2"/><text x="1334" y="784" font-size="14" font-weight="700" fill="#6b3fa0" text-anchor="start" >Wear OS watch</text><text x="1334" y="806" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >adb install -r</text><rect x="30" y="440" width="270" height="290" rx="9" fill="#fff6d6" stroke="#8a6d00" stroke-width="2"/><text x="44" y="464" font-size="14.5" font-weight="700" fill="#8a6d00" text-anchor="start" >Secrets (you add them)</text><text x="44" y="486" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >repo Settings, Secrets and</text><text x="44" y="505" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >variables, Actions</text><text x="44" y="524" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" ></text><text x="44" y="543" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Cloudflare token + account ID</text><text x="44" y="562" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >   used by the site deploy</text><text x="44" y="581" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" ></text><text x="44" y="600" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Supabase access token +</text><text x="44" y="619" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >database password</text><text x="44" y="638" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >   used by the site check and</text><text x="44" y="657" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >   the database button</text><text x="44" y="676" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" ></text><text x="44" y="695" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >Public, not secret: Supabase</text><text x="44" y="714" font-size="12.5" font-weight="400" fill="#333" text-anchor="start" >URL and publishable key</text><rect x="30" y="868" width="1500" height="44" rx="8" fill="#fff" stroke="#bbb"/><rect x="50" y="882" width="16" height="16" fill="#e4f4ea" stroke="#1e6b3a" stroke-width="2"/><text x="74" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >automatic</text><rect x="225" y="882" width="16" height="16" fill="#fdeedb" stroke="#9a4f00" stroke-width="2"/><text x="249" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >needs your click</text><rect x="400" y="882" width="16" height="16" fill="#efe6f8" stroke="#6b3fa0" stroke-width="2"/><text x="424" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >on your PC</text><rect x="575" y="882" width="16" height="16" fill="#fbe4e4" stroke="#a32020" stroke-width="2"/><text x="599" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >stop</text><rect x="750" y="882" width="16" height="16" fill="#e6eef8" stroke="#1f4e79" stroke-width="2"/><text x="774" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >checks (CI)</text><rect x="925" y="882" width="16" height="16" fill="#fff6d6" stroke="#8a6d00" stroke-width="2"/><text x="949" y="895" font-size="13" font-weight="400" fill="#222" text-anchor="start" >secrets</text></svg>