# CI: checks on every push and pull request. The last job (deploy-site) also puts the phone app live,
# but only for a push to main, only when all checks are green, only when production's database is
# up to date, and only when you have switched it on (repo variable DEPLOY_ENABLED = true).
# How it all fits together: docs/CICD.md and docs/cicd.png.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # The version these tests were written against. Change it on purpose, not by accident.
          version: 2.122.0
      - name: Start a temporary database
        run: supabase start -x imgproxy,edge-runtime,logflare,vector,realtime,storage-api,inbucket,mailpit
      - name: Run the database tests
        run: supabase test db

  phone-app:
    name: Phone app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: "Build with placeholder addresses (this build is only a check and is never published)"
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  importer-tests:
    name: Importer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: importer/requirements.txt
      - run: pip install -r importer/requirements.txt
      - name: Run the importer tests
        working-directory: importer
        run: python -m pytest

  watch-app:
    name: Watch app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: "Unit tests, then build the debug app (a check only, nothing is installed or published)"
        working-directory: watch
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

  deploy-site:
    name: Deploy the site
    needs: [database-tests, phone-app, importer-tests, watch-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # The phone app expects the newest database. If a migration is waiting, stop here: the site must never
      # go live before a database change it needs. Run "Update database", then re-run this job.
      - name: Is production's database up to date?
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          out="$(supabase db push --dry-run 2>&1)"
          echo "$out"
          if ! echo "$out" | grep -qi "up to date"; then
            echo "::error title=Database changes are waiting::Production has migrations that are not applied yet. Run the 'Update database' workflow first, then re-run this job."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build the phone app for production
        working-directory: web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare
        working-directory: web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
